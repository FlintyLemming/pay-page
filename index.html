<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>扫码付款</title>
  <meta name="description" content="使用支付宝或微信扫码付款">
  <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e12" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231677FF'/%3E%3Cstop offset='1' stop-color='%2307C160'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 13v-2a2 2 0 0 1 2-2h2m6 0h2a2 2 0 0 1 2 2v2m0 6v2a2 2 0 0 1-2 2h-2m-6 0h-2a2 2 0 0 1-2-2v-2m0-3h14' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f5f8;
      --text: #101418;
      --muted: #5f6b7a;
      --faint: #8a94a3;
      --glow-wechat: rgba(7, 193, 96, .16);
      --glow-alipay: rgba(22, 119, 255, .16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0e12;
        --text: #eef1f5;
        --muted: #9aa4b2;
        --faint: #6b7584;
        --glow-wechat: rgba(7, 193, 96, .13);
        --glow-alipay: rgba(22, 119, 255, .17);
      }
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
        "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* soft brand-coloured light behind everything */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(44rem 34rem at 10% -4%, var(--glow-alipay), transparent 70%),
        radial-gradient(44rem 34rem at 90% 104%, var(--glow-wechat), transparent 70%);
    }

    .page {
      width: 100%;
      max-width: 760px;
      padding: 48px 16px 36px;
      padding: max(48px, env(safe-area-inset-top)) 16px max(36px, env(safe-area-inset-bottom));
    }

    .intro {
      margin-bottom: 32px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .26em;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: .06em;
    }

    .sub {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .methods {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 330px));
      justify-content: center;
      gap: 24px;
    }

    /* ---- payment card: same layout for both, only the colour set differs ---- */

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 20px 20px 18px;
      border-radius: 28px;
      color: #fff;
      background: linear-gradient(160deg, var(--c1), var(--c2) 55%, var(--c3));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 26px 50px -30px var(--shadow);
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards;
    }

    .card--wechat {
      --c1: #12cb6c;
      --c2: #07b65a;
      --c3: #05974a;
      --shadow: rgba(5, 150, 75, .75);
      --plate-shadow: rgba(0, 70, 35, .5);
    }

    .card--alipay {
      --c1: #3a90ff;
      --c2: #1677ff;
      --c3: #0b5fe0;
      --shadow: rgba(16, 95, 225, .75);
      --plate-shadow: rgba(0, 35, 115, .5);
    }

    .card + .card { animation-delay: .08s; }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: -1;
      background: radial-gradient(90% 60% at 8% 0%, rgba(255, 255, 255, .2), transparent 70%);
    }

    .card__mark {
      position: absolute;
      z-index: -1;
      top: -34px;
      right: -38px;
      width: 172px;
      height: 172px;
      color: #fff;
      opacity: .1;
      transform: rotate(-12deg);
      pointer-events: none;
    }

    .card--alipay .card__mark {
      width: 150px;
      height: 150px;
      top: -30px;
      right: -30px;
    }

    .card__head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 2px 2px 18px;
    }

    .card__logo {
      flex: none;
      width: 34px;
      height: 34px;
      color: #fff;
    }

    .card--alipay .card__logo {
      width: 30px;
      margin: 0 2px;
    }

    .card__head h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: .04em;
    }

    .card__head p {
      margin: 1px 0 0;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .08em;
      opacity: .82;
    }

    .card__qr {
      display: block;
      overflow: hidden;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 32px -18px var(--plate-shadow), 0 0 0 1px rgba(255, 255, 255, .5);
      transition: transform .15s ease;
    }

    .card__qr img {
      display: block;
      width: 100%;
      height: auto;
    }

    .card__hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: fit-content;
      margin: 16px auto 2px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .12);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .card__hint svg {
      flex: none;
      width: 16px;
      height: 16px;
    }

    /* replaces the hint where the payment link can open the app */
    .card__pay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 46px;
      margin: 16px 0 2px;
      padding: 0 20px;
      border-radius: 999px;
      background: #fff;
      color: var(--c3);
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .04em;
      text-decoration: none;
      box-shadow: 0 12px 24px -14px var(--plate-shadow);
      transition: transform .15s ease, background-color .15s ease;
    }

    .card__pay svg {
      flex: none;
      width: 18px;
      height: 18px;
      animation: nudge 1.6s ease-in-out infinite;
    }

    .card__pay:active,
    .card__qr[href]:active {
      transform: scale(.97);
    }

    .card__pay:active { background: rgba(255, 255, 255, .88); }

    .note {
      margin: 28px 0 0;
      color: var(--faint);
      font-size: 13px;
      text-align: center;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
    }

    @keyframes nudge {
      50% { transform: translateX(3px); }
    }

    @media (hover: hover) {
      .card { transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s; }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 34px 60px -30px var(--shadow);
      }
    }

    @media (max-width: 720px) {
      .page { padding-top: 36px; padding-top: max(36px, env(safe-area-inset-top)); }
      .intro { margin-bottom: 24px; }
      h1 { font-size: 26px; }
      .methods { grid-template-columns: minmax(0, 380px); gap: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; transition: none; }
      .card__pay svg { animation: none; }
    }
  </style>
</head>
<body>

  <main class="page">
    <header class="intro">
      <p class="eyebrow">SCAN TO PAY</p>
      <h1>扫码付款</h1>
      <p class="sub" id="intro-sub">请使用支付宝或微信扫描下方二维码</p>
    </header>

    <div class="methods">
      <section class="card card--alipay" aria-labelledby="alipay-title">
        <svg class="card__mark" aria-hidden="true"><use href="#logo-alipay"/></svg>
        <header class="card__head">
          <svg class="card__logo" aria-hidden="true"><use href="#logo-alipay"/></svg>
          <div>
            <h2 id="alipay-title">支付宝</h2>
            <p>Alipay</p>
          </div>
        </header>
        <a class="card__qr" id="alipay-qr">
          <img src="assets/alipay.png" width="1128" height="1128" alt="支付宝收款码">
        </a>
        <p class="card__hint" id="alipay-hint">
          <svg aria-hidden="true"><use href="#icon-scan"/></svg>
          <span>打开支付宝，扫一扫</span>
        </p>
        <!-- shown instead of the hint on phones, where this link opens Alipay (see the script below) -->
        <a class="card__pay" id="alipay-pay" href="https://qr.alipay.com/2m618761jsklwq3dlghea29" hidden>
          <span>点击打开支付宝付款</span>
          <svg aria-hidden="true"><use href="#icon-arrow"/></svg>
        </a>
      </section>

      <section class="card card--wechat" aria-labelledby="wechat-title">
        <svg class="card__mark" aria-hidden="true"><use href="#logo-wechat"/></svg>
        <header class="card__head">
          <svg class="card__logo" aria-hidden="true"><use href="#logo-wechat"/></svg>
          <div>
            <h2 id="wechat-title">微信支付</h2>
            <p>WeChat Pay</p>
          </div>
        </header>
        <div class="card__qr">
          <img src="assets/wechat-pay.png" width="1128" height="1128" alt="微信支付收款码">
        </div>
        <p class="card__hint" id="wechat-hint">
          <svg aria-hidden="true"><use href="#icon-scan"/></svg>
          <span>打开微信，扫一扫</span>
        </p>
      </section>
    </div>

    <p class="note">付款前请核对收款方信息</p>
  </main>

  <script>
    // On a phone you can't scan your own screen, so adjust the hints to what works where the page was opened.
    (function () {
      var ua = navigator.userAgent;
      var env = /MicroMessenger/i.test(ua) ? "wechat"
        : /AlipayClient/i.test(ua) ? "alipay"
        : /Android|iPhone|iPad|iPod|HarmonyOS|Mobile/i.test(ua) ? "mobile"
        : "";
      if (!env) return;
      document.documentElement.setAttribute("data-env", env);

      function hint(id, text) {
        document.querySelector("#" + id + " span").textContent = text;
      }

      // A WeChat payment code can only be scanned or long-pressed, never opened from a link.
      hint("wechat-hint", env === "wechat" ? "长按二维码，识别付款" : "请截图后用微信扫码");

      // WeChat blocks Alipay links, so there the Alipay code has to be scanned as well.
      if (env === "wechat") {
        hint("alipay-hint", "请截图后用支付宝扫码");
        return;
      }

      // Inside Alipay, or in a phone browser, the payment link opens Alipay straight to this code:
      // say so up front, swap the hint for a button, and make the code itself tappable too.
      var pay = document.getElementById("alipay-pay");
      document.getElementById("intro-sub").textContent = "支付宝可点击直接付款，微信请截图扫码";
      pay.querySelector("span").textContent = env === "alipay" ? "点击立即付款" : "点击打开支付宝付款";
      pay.hidden = false;
      document.getElementById("alipay-hint").hidden = true;
      document.getElementById("alipay-qr").href = pay.href;
    })();
  </script>
